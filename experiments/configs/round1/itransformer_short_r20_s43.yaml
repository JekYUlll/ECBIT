seed: 43
device: cuda
data:
  manifest_csv: data/antaws_impute_manifest.csv
  train_station_groups:
  - main
  val_station_groups:
  - main
  test_station_groups:
  - main
training:
  epochs: 50
  batch_size: 32
  num_workers: 4
  lr: 0.0001
  weight_decay: 0.0001
  patience: 10
eval:
  batch_size: 64
  num_workers: 4
output_dir: experiments/results/metrics/round1/itransformer_short_r20_s43
runner: train
model:
  name: itransformer
  seq_len: 168
  n_vars: 5
  n_time: 4
  d_model: 128
  n_heads: 8
  n_layers: 3
  d_ff: 256
  dropout: 0.1
missing:
  pattern: short
  rate: 0.2
  min_block: 6
  max_block: 24
  variable_wise: true
run_name: itransformer_short_r20_s43
