seed: 42
device: cuda
data:
  manifest_csv: data/antaws_impute_manifest.csv
  train_station_groups:
  - main
  val_station_groups:
  - main
  test_station_groups:
  - main
training:
  epochs: 50
  batch_size: 32
  num_workers: 4
  lr: 0.0001
  weight_decay: 0.0001
  patience: 10
eval:
  batch_size: 64
  num_workers: 4
output_dir: experiments/results/metrics/followup_blocklen/ecbit_blocklen_24h_no_era5_s42
runner: train
model:
  name: ecbit
  variant: no_era5
  seq_len: 168
  n_vars: 5
  n_time: 4
  d_model: 128
  n_heads: 8
  n_layers: 3
  d_ff: 256
  dropout: 0.1
  use_era5: false
  use_cross: false
missing:
  pattern: blocklen_24h
  rate: 0.4
  min_block: 2
  max_block: 8
  variable_wise: true
analysis:
  block_max_hours: 24
  block_min_steps: 2
  block_max_steps: 8
run_name: ecbit_blocklen_24h_no_era5_s42
