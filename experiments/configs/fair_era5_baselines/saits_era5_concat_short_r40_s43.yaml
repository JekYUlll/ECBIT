seed: 43
device: cuda
data:
  manifest_csv: data/antaws_impute_manifest.csv
  train_station_groups:
  - main
  val_station_groups:
  - main
  test_station_groups:
  - main
training:
  epochs: 50
  batch_size: 32
  num_workers: 4
  lr: 0.0001
  weight_decay: 0.0001
  patience: 10
eval:
  batch_size: 64
  num_workers: 4
output_dir: experiments/results/metrics/fair_era5_baselines/saits_era5_concat_short_r40_s43
runner: evaluate
model:
  name: saits_era5_concat
  seq_len: 168
  n_vars: 5
  n_features: 10
  model_kwargs:
    n_layers: 2
    d_model: 128
    n_heads: 4
    d_k: 32
    d_v: 32
    d_ffn: 256
    dropout: 0.1
    attn_dropout: 0.1
    batch_size: 32
    epochs: 50
    patience: 10
    num_workers: 0
    verbose: false
missing:
  pattern: short
  rate: 0.4
  min_block: 6
  max_block: 24
  variable_wise: true
run_name: saits_era5_concat_short_r40_s43
