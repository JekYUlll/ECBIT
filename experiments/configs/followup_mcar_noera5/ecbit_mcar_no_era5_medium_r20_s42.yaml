seed: 42
device: cuda
data:
  manifest_csv: data/antaws_impute_manifest.csv
  train_station_groups:
  - main
  val_station_groups:
  - main
  test_station_groups:
  - main
training:
  epochs: 50
  batch_size: 32
  num_workers: 4
  lr: 0.0001
  weight_decay: 0.0001
  patience: 10
eval:
  batch_size: 64
  num_workers: 4
output_dir: experiments/results/metrics/followup_mcar_noera5/ecbit_mcar_no_era5_medium_r20_s42
runner: train
model:
  name: ecbit
  variant: no_era5
  seq_len: 168
  n_vars: 5
  n_time: 4
  d_model: 128
  n_heads: 8
  n_layers: 3
  d_ff: 256
  dropout: 0.1
  use_era5: false
  use_cross: false
missing:
  pattern: mcar
  target_pattern: medium
  rate: 0.2
run_name: ecbit_mcar_no_era5_medium_r20_s42
